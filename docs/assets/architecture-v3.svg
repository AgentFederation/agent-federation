<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1212" viewBox="0 0 1600 1010">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#536378" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#24354b;font-size:16px} .title{font-size:30px;font-weight:600}.section{font-size:21px;font-weight:600}.small{font-size:14px;fill:#63748b}.node{fill:white;stroke:#b9c8dc;stroke-width:1.5}.edge{fill:none;stroke:#536378;stroke-width:1.7;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.dash{stroke-dasharray:6 5}.label{fill:#f8fafc;stroke:none}</style>
<rect width="1600" height="1010" fill="#f8fafc"/>
<text x="40" y="48" class="title">AI 自主组织 · 系统架构 v3</text><text x="40" y="77" class="small">跨机器接入：组织身份与机器分离，每次任务选择可用节点及其 Agent runtime。</text>
<!-- organizational model -->
<rect x="40" y="112" width="620" height="288" rx="18" fill="#edf4ff" stroke="#91b6eb" stroke-width="2"/>
<text x="62" y="145" class="section">组织定义</text><text x="454" y="145" class="small">定义数据，不是运行进程</text>
<rect x="62" y="164" width="576" height="44" rx="8" fill="#d8e8ff"/><text x="350" y="192" text-anchor="middle">共同目标 · 希望持续达到的结果</text>
<path class="edge" d="M150 208V234"/><path class="edge" d="M350 208V234"/><path class="edge" d="M550 208V234"/>
<g><rect class="node" x="62" y="238" width="176" height="52" rx="8"/><text x="150" y="260" text-anchor="middle">职责 1 · 统筹</text><text x="150" y="280" text-anchor="middle" class="small">持续安排与协调</text></g>
<g><rect class="node" x="262" y="238" width="176" height="52" rx="8"/><text x="350" y="260" text-anchor="middle">职责 2 · 内容</text><text x="350" y="280" text-anchor="middle" class="small">持续提供合格交付</text></g>
<g><rect class="node" x="462" y="238" width="176" height="52" rx="8"/><text x="550" y="260" text-anchor="middle">职责 3 · 复盘</text><text x="550" y="280" text-anchor="middle" class="small">发现问题与改进机会</text></g>
<path class="edge" d="M150 290V333"/><path class="edge" d="M350 290V333"/><path class="edge" d="M550 290V333"/>
<rect x="314" y="299" width="72" height="23" fill="#edf4ff"/><text x="350" y="316" text-anchor="middle" class="small">承担关系</text>
<rect class="node" x="62" y="337" width="176" height="42" rx="8"/><text x="150" y="364" text-anchor="middle">成员 A</text>
<rect class="node" x="262" y="337" width="176" height="42" rx="8"/><text x="350" y="364" text-anchor="middle">成员 B</text>
<rect class="node" x="462" y="337" width="176" height="42" rx="8"/><text x="550" y="364" text-anchor="middle">成员 C</text>
<!-- environment upper right -->
<rect x="850" y="112" width="710" height="288" rx="18" fill="#f0f3f7" stroke="#adb9c8" stroke-width="2"/>
<text x="872" y="145" class="section">真实业务环境</text>
<rect class="node" x="872" y="168" width="666" height="53" rx="8"/><text x="1205" y="199" text-anchor="middle">资料、内容、对话与业务记录</text>
<rect class="node" x="872" y="240" width="666" height="53" rx="8"/><text x="1205" y="271" text-anchor="middle">现有业务工具 / 外部平台</text>
<rect x="872" y="318" width="666" height="60" rx="8" fill="#e0e6ee"/><text x="1205" y="344" text-anchor="middle">场景适配接口</text><text x="1205" y="365" text-anchor="middle" class="small">观察事实 · 操作工具 · 核对结果</text>
