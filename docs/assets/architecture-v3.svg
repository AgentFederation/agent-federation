<path class="edge" d="M159 710V661H310V630"/><rect class="label" x="174" y="645" width="112" height="25"/><text x="230" y="663" text-anchor="middle" class="small">读取协作规则</text>
<path class="edge both" d="M389 630V675H482V706"/><rect class="label" x="421" y="661" width="125" height="25"/><text x="482" y="679" text-anchor="middle" class="small">读取证据 / 更新状态</text>
<path class="edge dash" d="M326 755H284V685H142V630"/><text x="208" y="701" text-anchor="middle" class="small">到期项 / 待处理事件</text>
<!-- distributed execution pool -->
<rect x="850" y="486" width="710" height="444" rx="18" fill="#eaf6ef" stroke="#87b99b" stroke-width="2"/>
<text x="872" y="521" class="section">跨机器 Agent 执行资源</text><text x="1250" y="521" class="small">节点可独立增加或替换</text>
<rect x="872" y="546" width="666" height="48" rx="8" fill="#d5eadf"/><text x="1205" y="577" text-anchor="middle">统一节点接口 · HTTP / JSON · 领取任务 / 获取上下文 / 返回结果</text>
<rect x="872" y="626" width="320" height="274" rx="12" fill="#f8fcfa" stroke="#8cb69c" stroke-width="2"/>
<text x="888" y="653" class="section">机器 A</text><text x="1092" y="653" class="small">node-a</text>
<rect x="888" y="668" width="288" height="38" rx="7" fill="#d5eadf"/><text x="1032" y="693" text-anchor="middle">节点接入器 · 统一插件接口</text>
<rect class="node" x="902" y="718" width="274" height="34" rx="7"/><text x="1039" y="741" text-anchor="middle">Codex</text>
<path class="edge" d="M888 688 V735 H898"/>
<rect class="node" x="902" y="761" width="274" height="34" rx="7"/><text x="1039" y="784" text-anchor="middle">DeepSeek harness</text>
