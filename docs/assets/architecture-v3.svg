<!-- intercontainer connections -->
<path class="edge" d="M350 400V482"/><rect class="label" x="249" y="427" width="202" height="25"/><text x="350" y="445" text-anchor="middle">加载职责与成员承担关系</text>
<path class="edge" d="M638 570H868"/><rect class="label" x="675" y="540" width="151" height="22"/><text x="750" y="557" text-anchor="middle" class="small">成员 + 任务 + 上下文</text>
<path class="edge" d="M850 891H735V785H664"/><rect class="label" x="675" y="837" width="137" height="24"/><text x="750" y="855" text-anchor="middle" class="small">判断 / 交付 / 改进建议</text>
<path class="edge both" d="M1205 482V404"/><rect class="label" x="1138" y="431" width="134" height="25"/><text x="1205" y="449" text-anchor="middle" class="small">取证与业务工具调用</text>
<path class="edge dash" d="M850 349H750V503H664"/><rect class="label" x="689" y="419" width="121" height="25"/><text x="750" y="437" text-anchor="middle" class="small">新事实 / 业务事件</text>
<text x="40" y="952" class="small">v3：执行分配 = 成员任务 → 节点 ID + runtime；相同 runtime 可以出现在多台机器上，成员身份不随机器改变。</text>
<text x="40" y="976" class="small">各类 harness 通过符合统一协议的插件接入；名称仅作示例，不构成支持清单。节点不依赖共享本地目录。</text>
<text x="40" y="998" class="small">v1、v2 冻结保留。首期可同机部署；本图表达跨机器边界，不表示已实现多机运行或高可用。</text>
</svg>
