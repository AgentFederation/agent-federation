<rect class="node" x="62" y="550" width="160" height="76" rx="9"/><text x="142" y="568" text-anchor="middle" class="small">代码模块</text><text x="142" y="592" text-anchor="middle">职责触发器</text><text x="142" y="614" text-anchor="middle" class="small">时间到期 / 事件订阅</text>
<rect class="node" x="250" y="550" width="194" height="76" rx="9"/><text x="347" y="568" text-anchor="middle" class="small">代码模块</text><text x="347" y="592" text-anchor="middle">任务服务</text><text x="347" y="614" text-anchor="middle" class="small">任务登记 · 状态转换 · 交接</text>
<rect class="node" x="472" y="550" width="166" height="76" rx="9"/><text x="555" y="568" text-anchor="middle" class="small">代码模块</text><text x="555" y="592" text-anchor="middle">执行分配器</text><text x="555" y="614" text-anchor="middle" class="small">能力匹配 · 节点选派</text>
<path class="edge" d="M222 587H246"/><path class="edge" d="M444 587H468"/>
