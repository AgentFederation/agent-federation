<rect x="1234" y="668" width="288" height="38" rx="7" fill="#d5eadf"/><text x="1378" y="693" text-anchor="middle">节点接入器 · 统一插件接口</text>
<rect class="node" x="1248" y="718" width="274" height="34" rx="7"/><text x="1385" y="741" text-anchor="middle">Codex</text>
